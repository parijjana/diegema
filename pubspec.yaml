name: unamedaudiobookplayer
description: "A lightweight audiobook player supporting Local Audiobooks, LibriVox streaming, and archive.org cover art."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.2.0
  dart_rss: ^3.0.3
  archive: ^4.0.0
  path: ^1.9.0
  path_provider: ^2.1.2
  crypto: ^3.0.3
  just_audio: ^0.9.36
  audio_session: ^0.1.18
  drift: ^2.20.0
  sqlite3_flutter_libs: ^0.5.24
  url_launcher: ^6.3.0
  file_picker: ^11.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  drift_dev: ^2.20.0
  build_runner: ^2.4.9

flutter:
  uses-material-design: true

  assets:
    - assets/demo/catalog.json

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
