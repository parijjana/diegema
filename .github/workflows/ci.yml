name: CI

# Pull requests: analyze + test only. Pushes to main: also the macOS build.
# Branch pushes are covered by their pull request, so they do not run twice.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          # Pinned to the SDK the goldens are generated with: newer releases
          # render the Now Playing fade goldens a few pixels differently.
          flutter-version: 3.44.5

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --fatal-infos

      - name: Test
        run: flutter test --coverage

      - name: Build macOS (debug)
        if: github.event_name != 'pull_request'
        run: flutter build macos --debug
