name: diegema
description: "A lightweight audiobook player supporting Local Audiobooks, LibriVox streaming, and archive.org cover art."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.2.0
  dart_rss: ^3.0.3
  archive: ^4.0.0
  path: ^1.9.0
  path_provider: ^2.1.2
  crypto: ^3.0.3
  just_audio: ^0.9.36
  audio_session: ^0.1.18
  drift: ^2.20.0
  sqlite3_flutter_libs: ^0.5.24
  url_launcher: ^6.3.0
  file_picker: ^11.0.3
  # Persists small UI preferences that must survive a restart but do not
  # belong in the audiobook schema (e.g. whether the pinned-books row on
  # the Now Playing screen is shown). Works on web as well as native, so
  # the DEMO_MODE build keeps the same behaviour.
  shared_preferences: ^2.5.5
  audio_service: ^0.18.19
  permission_handler: ^12.0.3
  # Reads the build version for Settings -> About instead of hard-coding it.
  package_info_plus: ^8.3.0
  # Queued, resumable downloads that survive the app being backgrounded or
  # killed (BSD-3). Pinned: 9.6.x needs Flutter >= 3.47 and we pin 3.44.5.
  background_downloader: 9.5.9
  cryptography: ^2.9.0
  bonsoir: 7.1.5
  flutter_secure_storage: ^10.3.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  drift_dev: ^2.20.0
  build_runner: ^2.4.9
  # Used directly by test/services/local_book_metadata_test.dart to fake
  # path_provider's platform channel (same technique as other IO-backed
  # services' tests).
  path_provider_platform_interface: ^2.1.2
  plugin_platform_interface: ^2.1.8

flutter:
  uses-material-design: true

  assets:
    - assets/demo/catalog.json
    - assets/demo/covers/
    # Background ambience loops, built by tool/ambience/prepare_ambience.py
    # (CC0 recordings + generated noise; see assets/ambience/CREDITS.md).
    - assets/ambience/

  fonts:
    # Inter 4.0 (SIL Open Font License, assets/fonts/OFL.txt). The type
    # scale in lib/theme/app_typography.dart uses w400/w500/w600/w700, so
    # all four are bundled rather than letting the engine snap 500 and 600
    # onto the nearest of two files.
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
