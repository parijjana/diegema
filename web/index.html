<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="unamedaudiobookplayer">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>unamedaudiobookplayer</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="demo_banner.css">
</head>
<body>
  <!--
    The "this is a preview" demo notice lives here, outside the Flutter app
    entirely (Task 1 of the UI redesign — see
    lib/core/host_page_demo_notice.dart). It is plain, self-contained
    HTML/CSS/JS: no external requests, no CDN, works under a strict CSP.

    #demo-banner starts `display: none` (web/demo_banner.css) and is only
    ever revealed by a kDemoMode build (lib/main.dart), so a non-demo web
    build never shows it and the Flutter app in #flutter-host fills the
    full viewport exactly as before.
  -->
  <div id="demo-frame">
    <!--
      Viewport switcher. Lives outside #demo-stage deliberately: it is
      meta-chrome about the preview, not part of the app being previewed.
      Hidden by default like the banner, and revealed by the same
      kDemoMode-only call.

      Mobile is 390x844 — under app_metrics.dart's `Dim.wideBreakpoint`
      (760), so switching genuinely crosses the breakpoint and swaps the
      top tab bar for the bottom NavigationBar. Flutter sizes itself from
      #flutter-host's bounding box (web/flutter_bootstrap.js), so resizing
      the stage is all that is needed - no reload, no JS bridge.

      This is a LAYOUT preview, not device emulation: device pixel ratio,
      text scaling and touch behaviour stay desktop.
    -->
    <div id="demo-banner" role="note" aria-label="Preview notice">
      <div class="demo-banner__row">
        <svg class="demo-banner__icon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="2"/>
          <path d="M12 11v5.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          <circle cx="12" cy="7.75" r="1.15" fill="currentColor"/>
        </svg>
        <div class="demo-banner__text">
          <p class="demo-banner__title">This is a preview</p>
          <p class="demo-banner__body" id="demo-banner-body">
            A curated, work-in-progress demo. Only a couple of titles actually
            play; the rest are browse-only and marked &quot;Preview only&quot;.
          </p>
        </div>
        <!--
          Viewport switcher, inside the banner: it is chrome about the
          preview, and the banner is where preview chrome belongs.

          Mobile is 390x844 — under app_metrics.dart's `Dim.wideBreakpoint`
          (760), so switching genuinely crosses the breakpoint and swaps the
          top tab bar for the bottom NavigationBar. Flutter sizes itself
          from #flutter-host's bounding box (web/flutter_bootstrap.js), so
          resizing the stage is all that is needed — no reload, no JS
          bridge, and playback survives the switch.

          This is a LAYOUT preview, not device emulation: device pixel
          ratio, text scaling and touch behaviour stay desktop.
        -->
        <div id="demo-toolbar" role="group" aria-label="Preview viewport">
          <button type="button" class="demo-toolbar__btn is-active"
                  id="demo-view-desktop" aria-pressed="true">Desktop</button>
          <button type="button" class="demo-toolbar__btn"
                  id="demo-view-mobile" aria-pressed="false">Mobile</button>
        </div>
        <button
          type="button"
          id="demo-banner-toggle"
          class="demo-banner__toggle"
          aria-expanded="true"
          aria-label="Collapse the preview notice"
          title="Collapse"
        >&minus;</button>
      </div>
    </div>
    <!--
      The bordered "app" surface, a sibling of the banner rather than its
      parent: the banner is page chrome and stays put at the top, while
      this is the application it is describing. Giving the canvas a
      contained, rounded, bordered surface on a darker page ground is what
      makes it read as an app rather than a web page.
    -->
    <div id="demo-stage">
      <div id="flutter-host"></div>
    </div>
  </div>
  <script src="demo_banner.js"></script>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process. This
    project's web/flutter_bootstrap.js template points Flutter at
    #flutter-host above instead of <body> — see that file for why.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
